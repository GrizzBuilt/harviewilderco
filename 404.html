<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page Not Found | Harvie Wilder Co.</title>

    <style>
      :root {
        color-scheme: dark;
        --black: #050505;
        --cream: #f7f0df;
        --muted: #c9c0af;
        --pink: #ff8fc7;
        --blue: #65d6ff;
        --gold: #f6c85f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(circle at 25% 25%, rgb(255 143 199 / 13%), transparent 25rem),
          radial-gradient(circle at 75% 75%, rgb(101 214 255 / 11%), transparent 25rem),
          var(--black);
        color: var(--cream);
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(3rem, 10vw, 6rem) 1.5rem;
        border: 1px solid rgb(247 240 223 / 18%);
        border-radius: 2rem;
        background: rgb(10 10 10 / 82%);
        box-shadow: 0 2rem 7rem rgb(0 0 0 / 70%);
      }

      .code {
        margin: 0;
        color: var(--pink);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(5rem, 25vw, 11rem);
        font-weight: 700;
        letter-spacing: -0.08em;
        line-height: 0.8;
      }

      h1 {
        margin: 2rem auto;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.5rem, 5vw, 2.25rem);
        line-height: 1.3;
        text-wrap: balance;
      }

      a {
        display: inline-block;
        padding: 0.9rem 1.25rem;
        border: 1px solid var(--gold);
        border-radius: 999px;
        color: var(--gold);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
        transition: background-color 150ms ease, color 150ms ease;
      }

      a:hover,
      a:focus-visible {
        background: var(--gold);
        color: var(--black);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This little varmit wandered off the trail.</h1>
      <a href="/">Back to Harvie Wilder Co.</a>
    </main>
  </body>
</html>
